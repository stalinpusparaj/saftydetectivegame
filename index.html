<style>
/* Layout concept: a full-bleed 3D toy diorama with a chunky, icon-first toy-button overlay floating above it. */
:root{
  --sky:#BFE6FF; --sky-d:#9FD3F5; --grass:#9ED36A; --path:#F3D9A4; --wall:#FFF4E0;
  --blue:#3B6FD8; --blue-d:#2A54B0; --warm:#FF9F43; --warm-d:#DB7A22; --hazard:#FFC93C;
  --ink:#2B2A3A; --muted:#6B6A80; --paper:#FFFFFF; --cream:#FFF9EE; --line:#D9E3F2;
  --font-en:'Baloo 2','Nirmala UI','Segoe UI',system-ui,sans-serif;
  --font-ta:'Baloo Thambi 2','Noto Sans Tamil','Nirmala UI','Latha',system-ui,sans-serif;
  --tap:72px; --r-lg:28px; --r-md:20px;
  --lift:0 6px 0 #C7D3E8, 0 12px 24px rgba(43,42,58,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font-en);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.ta{font-family:var(--font-ta)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;transition:filter .35s}
#game.frozen{filter:saturate(.18) brightness(1.04) contrast(.95)}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--warm);outline-offset:3px}

/* ---------- toy buttons ---------- */
.btn{pointer-events:auto;min-width:var(--tap);min-height:var(--tap);border-radius:var(--r-md);background:var(--paper);box-shadow:var(--lift);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:6px 22px;font-weight:800;font-size:clamp(18px,3.2vmin,26px);line-height:1.1;transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #C7D3E8}
.btn .ic{font-size:1.7em;line-height:1}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d),0 12px 24px rgba(43,42,58,.2)}
.btn.primary:active{box-shadow:0 2px 0 var(--blue-d)}
.btn.warm{background:var(--warm);color:#fff;box-shadow:0 6px 0 var(--warm-d),0 12px 24px rgba(43,42,58,.2)}
.btn.round{border-radius:50%;padding:0;width:var(--tap);height:var(--tap)}
.btn.big{min-height:96px;font-size:clamp(22px,4vmin,32px);padding:8px 34px;border-radius:30px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- top bar ---------- */
#topbar{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px))}
.tb{display:flex;gap:10px;align-items:center}
.tbtn{pointer-events:auto;width:var(--tap);height:var(--tap);border-radius:50%;background:rgba(255,255,255,.94);box-shadow:var(--lift);font-size:34px;display:grid;place-items:center;line-height:1}
.tbtn:active{transform:translateY(3px)}
.langbtn{pointer-events:auto;height:var(--tap);border-radius:36px;background:rgba(255,255,255,.94);box-shadow:var(--lift);padding:0 10px;display:flex;align-items:center;gap:2px;font-weight:800;font-size:20px}
.langbtn span{padding:6px 12px;border-radius:16px;color:var(--muted);line-height:1.2}
.langbtn span.on{background:var(--blue);color:#fff}
.langbtn .lta{font-family:var(--font-ta)}
.langbtn .sep{padding:0 2px;color:var(--line)}
#hudSlots{display:flex;gap:6px;background:rgba(255,255,255,.9);border-radius:40px;padding:8px 14px;box-shadow:var(--lift);font-size:30px;line-height:1;align-items:center}
#hudSlots .slot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#EEF3FB;border:3px dashed #B9C7DF;font-size:24px;transition:transform .3s}
#hudSlots .slot.on{background:var(--blue);border:3px solid var(--blue);color:#fff;transform:scale(1.12)}

/* ---------- caption bubble ---------- */
#caption{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(900px,calc(100vw - 32px));
  display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:28px;padding:8px 22px 8px 8px;box-shadow:var(--lift);
  font-size:clamp(17px,3.5vmin,28px);font-weight:700;line-height:1.25;transition:opacity .25s, transform .25s;z-index:4}
#caption.off{opacity:0;transform:translate(-50%,14px)}
#caption .cap-who{flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--sky)}
#caption .cap-text{min-width:0;text-wrap:balance}
#caption.rule{background:var(--blue);color:#fff;font-size:clamp(20px,4.4vmin,36px);box-shadow:0 6px 0 var(--blue-d),0 12px 24px rgba(43,42,58,.2)}
#caption.rule .cap-who{background:#fff}

/* ---------- pointing hand ---------- */
#hand{position:absolute;left:0;top:0;pointer-events:none;z-index:6;will-change:transform}
#hand span{display:block;font-size:66px;line-height:1;transform-origin:30% 0;margin-left:-20px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25));animation:tapme 1s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:translateY(6px) scale(1)}50%{transform:translateY(-10px) scale(.9)}}

/* ---------- world markers ---------- */
#markers{position:absolute;inset:0;overflow:hidden;z-index:2}
#stageui{position:absolute;inset:0;z-index:3;pointer-events:none}
.wm{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform;display:flex;flex-direction:column;align-items:center;gap:2px}
.wm.nohit{pointer-events:none}
.bub{min-width:64px;height:64px;border-radius:32px;background:#fff;box-shadow:var(--lift);display:grid;place-items:center;font-size:34px;line-height:1;padding:0 10px;position:relative}
.bub::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.next{background:var(--hazard);animation:bob 1s ease-in-out infinite}
.bub.next::after{border-top-color:var(--hazard)}
.bub.lock{background:#EEF1F7;font-size:28px}
.bub.lock::after{border-top-color:#EEF1F7}
.bub.shake{animation:shake .5s}
.wm .nm{font-size:15px;font-weight:800;background:rgba(255,255,255,.88);border-radius:10px;padding:0 8px;margin-top:6px;white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-6deg)}40%{transform:translateX(8px) rotate(6deg)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;position:relative;transform:translateY(50%);pointer-events:none}
.ring.hz{border:7px solid var(--hazard);box-shadow:0 0 0 4px rgba(43,42,58,.55)}
.ring.sf{border:7px solid var(--blue);box-shadow:0 0 0 4px rgba(255,255,255,.8)}
.ring i{position:absolute;top:-22px;right:-22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:28px;line-height:1;border:3px solid #fff}
.ring.hz i{background:var(--hazard);color:var(--ink)}
.ring.sf i{background:var(--blue);color:#fff}
.ring.pop{animation:ringIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes ringIn{from{transform:translateY(50%) scale(.2);opacity:0}to{transform:translateY(50%) scale(1);opacity:1}}
.speech{background:#fff;border-radius:22px;padding:6px 14px;font-size:38px;line-height:1.1;box-shadow:var(--lift);white-space:nowrap;position:relative;animation:bob 1.2s ease-in-out infinite;cursor:pointer;min-width:72px;min-height:64px;display:grid;place-items:center}
.speech::after{content:"";position:absolute;bottom:-12px;left:18px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.clue-tag{background:#fff;border-radius:18px;padding:4px 10px;font-size:28px;box-shadow:var(--lift);animation:ringIn .45s cubic-bezier(.34,1.56,.64,1)}

/* ---------- tap feedback + comic bubbles ---------- */
.tapfx{position:absolute;transform:translate(-50%,-50%);font-size:44px;pointer-events:none;animation:tapfx .55s ease-out forwards;z-index:4}
@keyframes tapfx{from{opacity:.95;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.comic{background:#fff;border-radius:22px;padding:6px 14px;font-size:40px;line-height:1.1;box-shadow:var(--lift);white-space:nowrap;animation:ringIn .35s cubic-bezier(.34,1.56,.64,1)}

/* ---------- picture cards ---------- */
#cardsLayer{position:absolute;inset:0;pointer-events:none;z-index:3}
.cardset{position:absolute;left:0;right:0;top:calc(88px + env(safe-area-inset-top,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,26px);padding:0 16px;transition:opacity .3s}
.cardset.out{opacity:0}
.pcard{pointer-events:auto;position:relative;height:min(100%,300px);aspect-ratio:5/6;max-width:30vw;background:var(--paper);border-radius:26px;box-shadow:var(--lift);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;gap:4px;animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards;transition:transform .2s, opacity .3s}
.pcard .art{flex:1 1 auto;width:100%;border-radius:18px;background:var(--cream);display:flex;align-items:center;justify-content:center;gap:2px;font-size:clamp(34px,11vmin,84px);line-height:1;flex-wrap:wrap;min-height:0;overflow:hidden;position:relative}
.pcard .art .s{font-size:.62em}
.pcard .art .x{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5em;opacity:.0}
.pcard .lbl{flex:0 0 auto;font-size:clamp(13px,2.5vmin,19px);font-weight:800;text-align:center;line-height:1.12;text-wrap:balance}
.pcard.reading{transform:scale(1.06);box-shadow:0 0 0 6px var(--warm),var(--lift)}
.pcard.picked{transform:scale(1.08);box-shadow:0 0 0 7px var(--blue),var(--lift)}
.pcard.picked::after{content:"✔";position:absolute;top:-16px;right:-16px;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center;border:4px solid #fff}
.pcard.nope{animation:shake .5s}
.pcard.used{opacity:.45;filter:grayscale(.7)}
.pcard.multi{max-width:22vw}
.cardset.mini{top:auto;height:clamp(120px,30vh,190px);bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.cardset.mini .pcard{height:100%}
.cardset.mini .pcard .art{font-size:clamp(28px,7vmin,54px)}
@keyframes cardIn{from{transform:translateY(40px) scale(.6);opacity:0}}
.nopebub{position:absolute;left:50%;top:-14px;transform:translate(-50%,-100%);background:#fff;border-radius:20px;padding:8px 14px;font-size:40px;line-height:1;box-shadow:var(--lift);white-space:nowrap;animation:ringIn .35s cubic-bezier(.34,1.56,.64,1);z-index:2}

/* ---------- big action buttons (trickster / misc) ---------- */
.actions{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:clamp(10px,2vw,22px);padding:0 16px;pointer-events:none}
.abtn{pointer-events:auto;width:clamp(120px,22vw,220px);min-height:clamp(76px,19vmin,140px);border-radius:26px;background:#fff;box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards}
.abtn .ic{font-size:clamp(34px,8vmin,58px);line-height:1}
.abtn .lb{font-size:clamp(13px,2.4vmin,18px);font-weight:800;text-align:center;line-height:1.1;text-wrap:balance}
.abtn.reading{box-shadow:0 0 0 6px var(--warm),var(--lift);transform:scale(1.05)}
.abtn.nope{animation:shake .5s}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.screen.dim{background:rgba(191,230,255,.86);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.screen.clear{pointer-events:none}
.screen.clear .btn,.screen.clear button{pointer-events:auto}
.panel{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--lift);padding:18px 22px;max-width:min(920px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.xbtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:3}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.1}

/* title */
#scrTitle{justify-content:flex-end;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.logo{pointer-events:none;text-align:center;margin-bottom:auto;margin-top:calc(76px + env(safe-area-inset-top,0px))}
.logo h1{font-size:clamp(34px,8.2vmin,76px);font-weight:800;color:var(--blue);letter-spacing:.5px;
  -webkit-text-stroke:0;text-shadow:0 4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 -4px 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 10px 18px rgba(43,42,58,.25)}
body.ta .logo h1{font-size:clamp(26px,6.2vmin,58px)}
.logo p{margin:6px 0 0;font-size:clamp(17px,3.4vmin,26px);font-weight:800;color:var(--ink);background:rgba(255,255,255,.85);display:inline-block;padding:2px 16px;border-radius:20px}
.ver{position:absolute;left:14px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);pointer-events:none}

/* picker */
#pickRow{position:absolute;left:0;right:0;bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;padding:0 6vw;pointer-events:none}
#pickRow .btn{min-width:min(26vw,220px)}
#pickRow .btn.sel{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d)}
#pickTitle{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:clamp(22px,4.5vmin,38px);font-weight:800;background:rgba(255,255,255,.9);border-radius:24px;padding:4px 22px;white-space:nowrap;pointer-events:none}
#pickGo{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}

/* gate */
#scrGate .panel{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:min(420px,100%)}
#gateHold{position:relative;width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p,0)*1turn),#E3EAF6 0);display:grid;place-items:center;pointer-events:auto;touch-action:none}
#gateHold::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
#gateHold span{position:relative;font-size:52px}
.gate-ans{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.gate-ans .btn{min-width:84px;font-size:30px}
.gate-q{font-size:clamp(26px,5vmin,40px);font-weight:800;font-variant-numeric:tabular-nums}
.small{font-size:15px;color:var(--muted);font-weight:600;max-width:46ch;line-height:1.35}

/* dashboard */
#scrDash .panel{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;padding:20px 24px;text-align:left}
#scrDash h2{grid-column:1/-1;font-size:28px;color:var(--blue)}
#scrDash h3{font-size:19px;margin-bottom:8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:2px solid #EEF2F8;font-weight:700;font-size:18px}
.tog{pointer-events:auto;min-width:112px;height:48px;border-radius:24px;background:#E3EAF6;font-weight:800;font-size:17px;padding:0 14px}
.tog.on{background:var(--blue);color:#fff}
.stepper{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stepper button{width:48px;height:48px;border-radius:50%;background:#E3EAF6;font-size:26px;font-weight:800}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:10px;align-items:center;font-size:15px;font-weight:700}
.bar .tr{height:16px;border-radius:8px;background:#E8EEF7;overflow:hidden}
.bar .fl{height:100%;border-radius:8px;background:var(--blue)}
.bar .n{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.bar.weak .fl{background:var(--warm)}
.tips{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{background:#FFF4E6;border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.35;font-weight:600}
.tips li b{display:block;font-size:13px;color:var(--warm-d);text-transform:uppercase;letter-spacing:.06em}
.dash-actions{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* notebook */
#scrBook .panel{width:min(980px,100%);background:#FFFDF6;background-image:repeating-linear-gradient(#FFFDF6 0 34px,#E4ECF8 34px 36px);padding:18px 22px}
#scrBook h2{font-size:clamp(24px,4.6vmin,34px);color:var(--blue);margin-bottom:10px}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.page{background:#fff;border-radius:20px;box-shadow:0 4px 0 #E1E7F2;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:0}
.page .stk{width:clamp(70px,14vmin,104px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(38px,8vmin,60px);background:radial-gradient(circle at 35% 30%,#fff,#FFE7B3);border:5px solid var(--hazard);box-shadow:0 4px 0 #E2B23A}
.page.empty .stk{background:#EEF1F7;border:5px dashed #C3CDDE;box-shadow:none}
.page.empty .stk span{filter:brightness(0);opacity:.18}
.page .cn{font-weight:800;font-size:clamp(13px,2.3vmin,17px);line-height:1.15}
.page .st{font-size:20px;letter-spacing:2px;color:var(--warm)}
.page.empty .st{color:#C3CDDE}
.page button{pointer-events:auto}
.wardrobe{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wardrobe h3{width:100%;font-size:20px}
.wi{pointer-events:auto;width:76px;height:76px;border-radius:20px;background:#fff;box-shadow:0 4px 0 #E1E7F2;display:grid;place-items:center;font-size:36px;position:relative}
.wi.locked{opacity:.35;filter:grayscale(1)}
.wi.on{box-shadow:0 0 0 5px var(--blue),0 4px 0 #E1E7F2}
.wi .sw{width:40px;height:40px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(43,42,58,.2)}

/* reward */
#rewardUI{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;pointer-events:none;padding:80px 16px 110px}
.rcard{background:#fff;border-radius:28px;box-shadow:var(--lift);padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:cardIn .6s cubic-bezier(.34,1.56,.64,1) backwards;max-width:40vw}
.rcard .stk{width:clamp(90px,20vmin,150px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(50px,11vmin,90px);background:radial-gradient(circle at 35% 30%,#fff,#FFE7B3);border:6px solid var(--hazard);box-shadow:0 5px 0 #E2B23A}
.rcard .cn{font-weight:800;font-size:clamp(15px,2.8vmin,22px);text-align:center;line-height:1.15}
.stars{font-size:clamp(34px,7vmin,56px);letter-spacing:4px;color:var(--warm);text-shadow:0 3px 0 #fff;line-height:1}
.stars .e{color:#C9D3E3}
#rewardBtns{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:16px;pointer-events:none}

/* rest */
#scrRest .panel{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:#2F3B6B;color:#fff}
#scrRest .moon{font-size:72px;line-height:1}
#scrRest h2{font-size:clamp(26px,5vmin,40px)}
#scrRest .btn{color:var(--ink)}

/* keypad (112) */
.phone{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-46%);width:min(300px,42vw);background:#2F3B6B;border-radius:34px;padding:12px;box-shadow:0 8px 0 #1E2850,0 14px 30px rgba(0,0,0,.25);pointer-events:auto;display:flex;flex-direction:column;gap:8px;animation:cardIn .5s cubic-bezier(.34,1.56,.64,1)}
.phone .scr{background:#DDF2FF;border-radius:18px;height:clamp(40px,9vmin,58px);display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(26px,6vmin,42px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:6px}
.phone .scr .g{color:#A9C3DA}
.phone .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.phone .keys button{height:clamp(40px,10.5vmin,72px);border-radius:16px;background:#fff;font-size:clamp(22px,5.5vmin,38px);font-weight:800;box-shadow:0 4px 0 #9AA6C8}
.phone .keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #9AA6C8}
.phone .keys button.hint{background:var(--hazard);animation:pulse .8s infinite}
.phone .keys button.nope{animation:shake .45s}
.phone.small{transform:translateY(-46%) scale(.55);transform-origin:right center;pointer-events:none;opacity:.9}
.lookbtns{position:absolute;left:0;right:0;top:50%;display:flex;justify-content:space-between;padding:0 calc(12px + env(safe-area-inset-left,0px));pointer-events:none}
.lookbtns .btn{font-size:40px}

/* timeline (rewind) */
.timeline{position:absolute;left:0;right:0;top:calc(88px + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:clamp(8px,2vw,20px);padding:0 16px;pointer-events:none}
.beat{pointer-events:auto;position:relative;width:clamp(96px,17vw,170px);aspect-ratio:4/3;background:#fff;border-radius:22px;box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(28px,6.5vmin,50px);line-height:1;animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards}
.beat .num{position:absolute;top:6px;left:10px;font-size:16px;font-weight:800;color:var(--muted)}
.beat.fixed{box-shadow:0 0 0 6px var(--blue),var(--lift)}
.beat.fixed::after{content:"✔";position:absolute;top:-14px;right:-14px;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;border:4px solid #fff}
.beat.playing{box-shadow:0 0 0 6px var(--warm),var(--lift)}
.beat-arrow{align-self:center;font-size:30px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.timeline{transition:opacity .25s}
.timeline.dim{opacity:0;pointer-events:none}
.timeline.dim .beat{pointer-events:none}

/* peephole + tablet frames */
#lens{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 40vmin,rgba(40,30,20,.55) 42vmin,#3A2A1C 44vmin,#3A2A1C 100%);z-index:1}
#lens::after{content:"";position:absolute;left:50%;top:50%;width:86vmin;height:86vmin;transform:translate(-50%,-50%);border-radius:50%;border:12px solid #D9A441;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
#tabletFrame{position:absolute;inset:0;pointer-events:none;z-index:1}
#tabletFrame .bezel{position:absolute;left:50%;top:50%;width:min(86vw,150vh);height:min(78vh,48vw);transform:translate(-50%,-52%);border-radius:34px;box-shadow:0 0 0 18px #2B2A3A,0 0 0 100vmax rgba(255,236,214,.97)}
#tabletFrame .callbar{position:absolute;left:50%;top:calc(50% - min(39vh,24vw) + 8px);transform:translateX(-50%);background:rgba(43,42,58,.75);color:#fff;border-radius:16px;padding:2px 16px;font-size:18px;font-weight:800;white-space:nowrap;display:flex;gap:8px;align-items:center}
#tabletFrame .callbar .dot{width:12px;height:12px;border-radius:50%;background:#FF6B6B;animation:pulse 1s infinite}
#tabletFrame.glitch .bezel{animation:glitch .25s steps(2) 3}
#game.glitch{animation:glitchCanvas .3s steps(3) 2}
@keyframes glitch{0%{transform:translate(-50%,-52%)}50%{transform:translate(calc(-50% + 6px),-52%)}}
@keyframes glitchCanvas{0%{filter:none}33%{filter:hue-rotate(18deg) contrast(1.15);transform:translateX(-5px)}66%{filter:hue-rotate(-12deg) brightness(1.08);transform:translateX(4px)}100%{filter:none;transform:none}}
body.rm #game.glitch,body.rm #tabletFrame.glitch .bezel{animation:none}

/* ---------- wipe, rotate, boot ---------- */
#wipe{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#wipe .hole{position:absolute;left:50%;top:50%;width:300vmax;height:300vmax;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 300vmax var(--blue);transition:width .42s ease-in,height .42s ease-in}
#wipe.closed{pointer-events:auto}
#wipe.closed .hole{width:0;height:0}
#wipe .mag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:90px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#wipe.closed .mag{transform:translate(-50%,-50%) scale(1)}
body.rm #wipe .hole{transition:none}
body.rm #wipe{transition:opacity .3s}
#rotate{position:fixed;inset:0;z-index:90;background:var(--blue);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;pointer-events:auto}
#rotate .ph{width:70px;height:120px;border:8px solid #fff;border-radius:16px;position:relative;animation:turn 2.2s ease-in-out infinite}
#rotate .ph::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff}
#rotate h2{font-size:30px}
@keyframes turn{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
#boot{position:fixed;inset:0;z-index:95;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:26px;font-weight:800;color:var(--blue)}
#boot .mag{font-size:80px;animation:pulse 1s infinite}
#dbg{position:fixed;left:8px;bottom:8px;z-index:99;background:rgba(0,0,0,.6);color:#0f0;font:12px monospace;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:pre}

@media (max-height:420px){
  #pickRow{bottom:78px}
  :root{--tap:72px}
  #caption{font-size:17px;padding:5px 16px 5px 5px}
  #caption .cap-who{width:46px;height:46px;font-size:27px}
  .cardset{top:84px;bottom:76px}
  .actions{bottom:72px}
  .abtn .ic{font-size:30px}
  .bub{height:54px;min-width:54px;font-size:28px}
  .wm .nm{display:none}
  .logo{margin-top:60px}
}
@media (max-width:720px){
  #scrDash .panel{grid-template-columns:1fr}
  .album{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
}
@media (prefers-reduced-motion:reduce){
  .pulse,.bub.next,#hand span{animation-duration:2.4s}
}
body.rm .pulse,body.rm .bub.next{animation:none}
body.rm #hand span{animation-duration:2.4s}

  <div class="ver" id="verLine"></div>
</section>

<section id="scrPicker" class="screen clear" hidden>
  <div id="pickTitle" data-t="choose_detective"></div>

</section>

<!-- Parent gate -->
<section id="scrGate" class="screen dim" hidden>
  <button class="btn round xbtn" data-close data-ta="close"><span class="ic">✖</span></button>

    <h2 data-t="gate_title"></h2>

      <div id="gateHold" role="button" aria-label="Hold"><span>✋</span></div>
      <div class="small" data-t="gate_hold"></div>
    </div>
    <div id="gateStep2" hidden style="display:flex;flex-direction:column;align-items:center;gap:12px">

<!-- Parent dashboard -->

    <button id="restMore" class="btn" style="margin-top:8px"><span class="ic">⚙️</span><span data-t="parent_more"></span></button>

</section>

<div id="wipe"><div class="hole"></div><div class="mag">🔍</div></div>

const Ease = {
  linear: k => k,
  inQuad: k => k * k,
  outQuad: k => k * (2 - k),
  inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  outBounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375; return n * (k -= 2.625 / d) * k + 0.984375; },
  outElastic: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
};
/* Tween: game-time driven, promise based. Tween.clear() on a stage change drops
   every pending tween, so any async story code awaiting one simply stops. */
const Tween = {
  list: [],
  run(dur, fn, { ease = Ease.inOutSine, delay = 0 } = {}) {
    return new Promise(res => this.list.push({ t: -delay, dur: Math.max(1e-4, dur), fn, ease, res }));
  },
  to(obj, props, dur, opts = {}) {
    const from = {}; for (const k in props) from[k] = obj[k];
    return this.run(dur, e => { for (const k in props) obj[k] = from[k] + (props[k] - from[k]) * e; }, opts);
  },
  wait(s) { return this.run(s, () => {}, { ease: Ease.linear }); },
  update(dt) {
    if (!this.list.length) return;
    const cur = this.list; this.list = [];
    const keep = [];
    for (const tw of cur) {
      tw.t += dt;
      if (tw.t < 0) { keep.push(tw); continue; }
      const k = Math.min(1, tw.t / tw.dur);
      tw.fn(tw.ease(k), k);
      if (k >= 1) tw.res(); else keep.push(tw);
    }
    this.list = keep.concat(this.list);
  },
  clear() { this.list = []; },
};

const Engine = {
  w: innerWidth, h: innerHeight, paused: false, last: 0, frames: 0, fpsT: 0, fps: 0,
  init() {
    this.canvas = $('#game');
    const r = this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: 'high-performance' });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.pixelRatioCap));
    r.setClearColor(0xBFE6FF, 1);
    this.resize();
    addEventListener('resize', () => this.resize());
    addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250));
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); else this.resume(); });
    this.loop = this.loop.bind(this);
    this.raf = requestAnimationFrame(this.loop);
  },
  resize() {
    this.w = Math.max(1, innerWidth); this.h = Math.max(1, innerHeight);
    this.renderer.setSize(this.w, this.h, false);
    if (SM.stage) SM.stage.resize(this.w, this.h);
  },
  pause() { if (this.paused) return; this.paused = true; cancelAnimationFrame(this.raf); Sfx.suspend(); Voice.pause(); },
  resume() { if (!this.paused) return; this.paused = false; this.last = performance.now(); this.raf = requestAnimationFrame(this.loop); Sfx.resume(); Voice.resumeOut(); },
  loop(now) {
    this.raf = requestAnimationFrame(this.loop);
    this.frame(now);
  },
  frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - (this.last || now)) / 1000));
    this.last = now;
    Tween.update(dt);
    const st = SM.stage;
    if (st) {
      st.update(dt);
      this.renderer.render(st.scene, st.camera);
      Markers.update(st.camera);
      Hand.update(st.camera);
    }
    if (CONFIG.debug) {
      this.frames++; this.fpsT += dt;
      if (this.fpsT > 0.5) { this.fps = Math.round(this.frames / this.fpsT); this.frames = 0; this.fpsT = 0;
        const i = this.renderer.info.render; $('#dbg').textContent = `fps ${this.fps}  calls ${i.calls}  tris ${i.triangles}`; }

const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _p = new THREE.Vector3(), _p2 = new THREE.Vector3();
function rayFrom(x, y, cam) { _ndc.set(x / Engine.w * 2 - 1, -(y / Engine.h) * 2 + 1); _ray.setFromCamera(_ndc, cam); return _ray; }
function groundPoint(x, y, cam, h = 0) {
  const r = rayFrom(x, y, cam).ray; if (Math.abs(r.direction.y) < 1e-5) return null;
  const k = (h - r.origin.y) / r.direction.y; if (!(k > 0)) return null;
  return r.origin.clone().addScaledVector(r.direction, k);
}
function toScreen(v, cam) { _p.copy(v).project(cam); return { x: (_p.x * 0.5 + 0.5) * Engine.w, y: (-_p.y * 0.5 + 0.5) * Engine.h, behind: _p.z > 1 }; }
function projRadius(v, r, cam) {
  const a = toScreen(v, cam);
  _p2.set(1, 0, 0).applyQuaternion(cam.quaternion).multiplyScalar(r).add(v);
  const b = toScreen(_p2, cam);
  return Math.hypot(a.x - b.x, a.y - b.y);
}
/* Screen-space picking: kid-friendly, every target is at least ~72px wide. */
function pickNearest(items, x, y, cam, minPx = 40) {
  let best = null, bs = 1;
  for (const it of items) {
    if (!it || it.disabled) continue;
    const w = typeof it.anchor === 'function' ? it.anchor() : it.anchor;
    const s = toScreen(w, cam); if (s.behind) continue;
    const r = Math.max(projRadius(w, it.radius || 0.3, cam), minPx);
    const sc = Math.hypot(s.x - x, s.y - y) / r;
    if (sc < bs) { bs = sc; best = it; }
  }
  return best;
}

function makeKid(species, costume = {}, opt = {}) {

  ch.armR.position.set(-0.31, 0.86, 0); ch.rig.add(ch.armR);

  update(cam) {
    for (const m of this.list) {
      const w = typeof m.world === 'function' ? m.world() : m.world;
      const s = toScreen(w, cam);
      if (s.behind) { m.d.style.display = 'none'; continue; }
      m.d.style.display = '';
      // keep tappable bubbles out from under the top bar: drop them below their anchor
      const h = m.h || (m.h = m.d.offsetHeight || 80), y = s.y + m.dy;
      const flip = !m.d.classList.contains('nohit') && y - h < 86;
      m.d.style.transform = `translate3d(${s.x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,${flip ? '-8%' : '-100%'})`;

/* Picture cards: icon art + short label; read aloud one by one so a child who
   can't read still knows every option. */
function cardArt(spec) {
  // "🐜 🦶|💥" : first group large, after '|' small badges; "!x" adds a cross overlay
  const [big, small = ''] = spec.split('|');
  const b = big.trim().split(/\s+/).filter(Boolean).map(e => `<span>${e}</span>`).join('');
  const s = small.trim().split(/\s+/).filter(Boolean).map(e => `<span class="s">${e}</span>`).join('');
  return b + s;
}
class CardSet {
  constructor(stage, items, { cls = '' } = {}) {
    this.stage = stage; this.items = items; this.reading = false; this._w = null; this.locked = false;
    this.root = UI.el(`<div class="cardset ${cls}"></div>`);
    items.forEach((it, i) => {
      const b = UI.el(`<button class="pcard ${it.multi ? 'multi' : ''}"><div class="art">${cardArt(it.art)}</div><div class="lbl" data-t="${it.label}"></div></button>`);
      b.style.animationDelay = (i * 0.12) + 's';
      b.addEventListener('click', () => this._click(i));
      this.root.appendChild(b);
    });
    UI.cards.appendChild(this.root); UI.applyLang(this.root);
    this.els = [...this.root.children];
  }
  _click(i) {
    if (this.locked || this.els[i].classList.contains('used')) return;
    Sfx.play('pop');
    if (this._w) { const w = this._w; this._w = null; w(i); }
    else { this.queued = i; Voice.interrupt(); } // tapped during an explanation: answer as soon as it ends
  }
  pick() {
    if (this.queued != null) { const q = this.queued; this.queued = null; return this.stage.step(Promise.resolve(q)); }
    return this.stage.step(new Promise(res => this._w = res));
  }
  async readAll(intro) {
    this.reading = true;
    if (intro) { await Voice.say(intro, { speaker: 'narrator' }); }
    for (let i = 0; i < this.els.length && this.reading; i++) {
      if (!this.stage.alive) return;
      this.els.forEach(e => e.classList.remove('reading'));
      this.els[i].classList.add('reading');
      await Voice.say(this.items[i].label, { speaker: 'narrator' });
    }
    this.els.forEach(e => e.classList.remove('reading'));
    this.reading = false;
  }
  stopReading() { this.reading = false; this.els.forEach(e => e.classList.remove('reading')); Voice.interrupt(); }
  async nope(i, line, icon = '🙅') {
    const el = this.els[i]; el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
    const bub = UI.el(`<div class="nopebub">${icon}</div>`); el.appendChild(bub);
    Sfx.play('boing');
    if (line) await this.stage.say(line, null, { speaker: 'narrator' }); else await this.stage.sleep(1.2);
    bub.remove(); el.classList.remove('nope');
  }
  mark(i, cls) { this.els[i].classList.add(cls); }
  remove() { this.root.classList.add('out'); const r = this.root; setTimeout(() => r.remove(), 320); }
}

      const tick = () => { const p = Math.min(1, (performance.now() - t0) / 3000); hold.style.setProperty('--p', p); if (p >= 1) { Sfx.play('chime'); step2(); return; } raf = requestAnimationFrame(tick); };
      const start = e => { e.preventDefault(); t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
      const stop = () => { cancelAnimationFrame(raf); if (s2.hidden) hold.style.setProperty('--p', 0); };
      const step2 = () => {
        s1.hidden = true; s2.hidden = false; ans.innerHTML = '';
        for (const n of shuffle([12, 11, 13, 15])) {

        }
      };
      const onClose = () => finish(false);
      hold.addEventListener('pointerdown', start); hold.addEventListener('pointerup', stop); hold.addEventListener('pointerleave', stop); hold.addEventListener('pointercancel', stop);
      scr.addEventListener('closed', onClose);
      function cleanup() { hold.removeEventListener('pointerdown', start); hold.removeEventListener('pointerup', stop); hold.removeEventListener('pointerleave', stop); hold.removeEventListener('pointercancel', stop); scr.removeEventListener('closed', onClose); }

function addLights(scene, { hemi = 1.25, dir = 1.85 } = {}) {
  const h = new THREE.HemisphereLight(0xffffff, 0xCBB89A, hemi);
  const d = new THREE.DirectionalLight(0xffffff, dir); d.position.set(4, 10, 7);
  scene.add(h, d); return { h, d };
}
class Stage {
  constructor() {
    this.scene = new THREE.Scene();
    this.scene.background = skyTexture();
    this.camera = new THREE.PerspectiveCamera(35, Engine.w / Engine.h, 0.1, 220);
    this.alive = true; this.chars = []; this.updaters = []; this.look = null;
    this.lights = addLights(this.scene);
    this.fx = new Particles(this.scene, Mat.plane, 140);
    this.sparks = new Particles(this.scene, Mat.star, 60);
  }
  resize(w, h) { this.camera.aspect = w / h; this.camera.updateProjectionMatrix(); }
  enter() {} start() {}
  update(dt) {
    if (!this.paused) for (const c of this.chars) c.update(dt);
    this.fx.update(dt); this.sparks.update(dt);
    for (const u of this.updaters) u(dt);
    if (this.look) this.camera.lookAt(this.look);
  }
  onTap() {} onDrag() {} onDragEnd() {} onHover() {}
  exit() {}
  dispose() {
    this.scene.traverse(o => { if (o.geometry && !o.geometry.userData.keep) o.geometry.dispose(); });
    if (this.scene.background && this.scene.background.dispose) this.scene.background.dispose();
  }
  /* cancellation-aware await: if the stage is gone, the async flow just stops */
  step(p) { return Promise.resolve(p).then(v => this.alive ? v : NEVER); }
  sleep(s) { return this.step(Tween.wait(s)); }
  say(id, who, opts = {}) { return this.step(Voice.say(id, { who: who || undefined, ...opts })); }
  addChar(c) { this.chars.push(c); this.scene.add(c.root); return c; }
  camTo(pos, look, dur = 1, ease = Ease.inOutSine) {
    const p0 = this.camera.position.clone(), l0 = (this.look || V3()).clone(); this.look = l0.clone();
    return this.step(Tween.run(dur, k => { this.camera.position.lerpVectors(p0, pos, k); this.look.lerpVectors(l0, look, k); }, { ease }));
  }
  setCam(pos, look) { this.camera.position.copy(pos); this.look = look.clone(); this.camera.lookAt(this.look); }
  sparkle(pos, n = 18) { this.sparks.burst(pos, { n, colors: [C.gold, 0xFFFFFF, 0xFFE58A], speed: 2.2, up: 2.2, gravity: 3, size: 0.18, life: 0.9 }); Sfx.play('sparkle'); }

}

      st.enter(params);
      if (!first) await UI.wipe(false);
      this.busy = false; Input.locked = false;

class Grid {
  constructor(n = 20, cell = 1, origin = -10) { this.n = n; this.cell = cell; this.o = origin; this.block = new Uint8Array(n * n); }
  cellOf(x, z) { return [Math.floor((x - this.o) / this.cell), Math.floor((z - this.o) / this.cell)]; }
  center(i, j) { return [this.o + (i + 0.5) * this.cell, this.o + (j + 0.5) * this.cell]; }
  ok(i, j) { return i >= 0 && j >= 0 && i < this.n && j < this.n && !this.block[j * this.n + i]; }
  set(i, j, v = 1) { if (i >= 0 && j >= 0 && i < this.n && j < this.n) this.block[j * this.n + i] = v; }
  blockWhere(fn) { for (let j = 0; j < this.n; j++) for (let i = 0; i < this.n; i++) { const [x, z] = this.center(i, j); if (fn(x, z)) this.set(i, j); } }
  nearestFree(i, j) {
    if (this.ok(i, j)) return [i, j];
    for (let r = 1; r < this.n; r++) { let best = null, bd = 1e9; for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) { if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue; if (this.ok(i + di, j + dj)) { const d = di * di + dj * dj; if (d < bd) { bd = d; best = [i + di, j + dj]; } } } if (best) return best; }
    return null;
  }
  find(a, b) {
    const n = this.n, key = (i, j) => j * n + i, H = (i, j) => Math.hypot(i - b[0], j - b[1]);
    const open = [[a[0], a[1]]], g = new Map([[key(...a), 0]]), from = new Map(), closed = new Set();
    while (open.length) {
      let bi = 0, bf = 1e9;
      for (let k = 0; k < open.length; k++) { const [i, j] = open[k]; const f = g.get(key(i, j)) + H(i, j); if (f < bf) { bf = f; bi = k; } }
      const [ci, cj] = open.splice(bi, 1)[0], ck = key(ci, cj);
      if (ci === b[0] && cj === b[1]) { const path = [[ci, cj]]; let k = ck; while (from.has(k)) { k = from.get(k); path.unshift([k % n, Math.floor(k / n)]); } return path; }
      closed.add(ck);
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue; const ni = ci + di, nj = cj + dj;
        if (!this.ok(ni, nj) || closed.has(key(ni, nj))) continue;
        if (di && dj && (!this.ok(ci + di, cj) || !this.ok(ci, cj + dj))) continue; // no corner cutting
        const ng = g.get(ck) + (di && dj ? 1.414 : 1), nk = key(ni, nj);
        if (!g.has(nk) || ng < g.get(nk)) { g.set(nk, ng); from.set(nk, ck); if (!open.some(([x, y]) => x === ni && y === nj)) open.push([ni, nj]); }
      }
    }
    return null;
  }
  lineFree(x0, z0, x1, z1) { const d = Math.hypot(x1 - x0, z1 - z0), n = Math.ceil(d / 0.2); for (let k = 0; k <= n; k++) { const [i, j] = this.cellOf(lerp(x0, x1, k / n), lerp(z0, z1, k / n)); if (!this.ok(i, j)) return false; } return true; }
  smooth(pts) { if (pts.length < 3) return pts; const out = [pts[0]]; let a = 0; while (a < pts.length - 1) { let b = pts.length - 1; while (b > a + 1 && !this.lineFree(pts[a][0], pts[a][1], pts[b][0], pts[b][1])) b--; out.push(pts[b]); a = b; } return out; }
}

function prismGeo(w, h, d) {
  const s = new THREE.Shape(); s.moveTo(-d / 2, 0); s.lineTo(d / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false }); g.translate(0, 0, -w / 2); g.rotateY(Math.PI / 2); g.computeVertexNormals(); return g;
}
function gableRoof(b, w, d, h, y0, wallCol, roofCol, oh = 0.28, th = 0.18, cx = 0, cz = 0) {

  });
}

function tapFx(x, y, icon = '🔍') {

/* comic bubble over a world point, auto-removed */
function comic(world, html, sec = 1.4) { const m = Markers.add(world, `<div class="comic">${html}</div>`); setTimeout(() => Markers.remove(m), sec * 1000); return m; }
/* fly an object along an arc to a target */
function flyTo(obj, target, { dur = 0.9, h = 1.2, rot = null, scale = null } = {}) {
  const p0 = obj.position.clone(), r0 = obj.rotation.clone(), s0 = obj.scale.x;
  Sfx.play('whoosh');
  return Tween.run(dur, k => {
    obj.position.lerpVectors(p0, target, k); obj.position.y += Math.sin(k * Math.PI) * h;
    if (rot) obj.rotation.set(lerp(r0.x, rot[0], k), lerp(r0.y, rot[1], k), lerp(r0.z, rot[2], k));
    if (scale != null) obj.scale.setScalar(lerp(s0, scale, k));
  }).then(() => Sfx.play('pop'));
}
async function wobble(obj, sec = 0.9, amt = 0.18) {
  const rz = obj.rotation.z, y = obj.position.y; const a = S.settings.reducedMotion ? amt * 0.4 : amt;
  await Tween.run(sec, k => { obj.rotation.z = rz + Math.sin(k * Math.PI * 8) * a * (1 - k); obj.position.y = y + Math.abs(Math.sin(k * Math.PI * 4)) * 0.06 * (1 - k); }, { ease: Ease.linear });
  obj.rotation.z = rz; obj.position.y = y;
}

const Learning = {
  record(concept, ok) {
    if (!(concept in S.mastery)) return;
    S.mastery[concept] = clamp((S.mastery[concept] || 0) + (ok ? 1 : -1), 0, 3);
    Save.save('mastery');
  },
  learned() { const set = new Set(); CASES.forEach(c => { if (S.progress.done[c.id]) c.concepts.forEach(k => set.add(k)); }); return [...set]; },
  needsPatrol(c) { return CASES.indexOf(c) > 0 && !S.progress.done[c.id] && !S.progress.patrol[c.id] && this.learned().length > 0; },
  /* 3 questions, weighted toward weak concepts (weight = 4 − mastery), no repeats */
  makePatrol(n = 3) {
    const pool = PATROL_BANK.filter(q => this.learned().includes(q.concept));
    const out = [];
    while (out.length < n && pool.length) {
      const w = pool.map(q => 4 - (S.mastery[q.concept] || 0));
      let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
      while (r > w[i]) { r -= w[i]; i++; }
      out.push(pool.splice(Math.min(i, pool.length - 1), 1)[0]);
    }
    return out;
  },
  /* put a missed question back 2–3 places later; pad with a filler so it is never immediate */
  requeue(queue, cur, q) {
    const gap = 2 + (Math.random() < 0.5 ? 1 : 0);
    while (queue.length < cur + gap) {
      const filler = PATROL_BANK.filter(x => this.learned().includes(x.concept) && x !== q && !queue.slice(cur + 1).includes(x));
      if (!filler.length) break;
      queue.push(pick(filler));
    }
    queue.splice(Math.min(cur + gap, queue.length), 0, q);
  },
};

  knifeHigh: () => { const g = standCounter(2.0, 0.9, 0.5); const p = makeProp('knifeBlock'); p.position.set(0, 2.0, 0); g.add(p); return g; },
  medLow: () => { const g = standCounter(0.5, 0.8, 0.8); const p = makeProp('medicine'); p.position.set(0, 0.5, 0); g.add(p); return g; },
  medHigh: () => { const g = standCounter(1.6, 0.9, 0.5); const p = makeProp('cabinetMeds'); p.position.set(0, 2.1, -0.05); p.scale.setScalar(0.62); g.add(p); g.userData.anchorY = 2.1; return g; },
};
function standCounter(h, w = 1.3, d = 0.9) {
  const g = new THREE.Group(), b = new GB(0.04);
  b.add(rbox(w, h, d, 0.06), 0xBFE3DA, { p: [0, h / 2, 0] }); b.add(rbox(w + 0.1, 0.08, d + 0.1, 0.03), 0xFFFFFF, { p: [0, h - 0.02, 0] });
  g.add(mk(b)); g.userData.anchorY = h + 0.2; return g;
}

/* ---------- Stage: Daily Patrol at Detective HQ ---------- */
class PatrolStage extends Stage {
  enter({ next }) {
    this.next = next;
    UI.topbar({ home: true });
    const b = new GB(0.04);
    b.add(rbox(10, 0.3, 7, 0.1), 0xDCE7FA, { p: [0, -0.15, 0.5], outline: false });
    b.add(rbox(10, 4.4, 0.25, 0.06), 0xF3F7FF, { p: [0, 2.2, -2.9], outline: false });
    b.add(rbox(3.4, 1.9, 0.1, 0.06), 0xD9A066, { p: [0, 2.7, -2.75] });
    [[-1.1, 3.1, 0xFFFFFF], [0.2, 2.5, 0xFFE58A], [1.1, 3.2, 0xBDE3F5], [-0.6, 2.2, 0xF7C9D9]].forEach(([x, y, c]) => { b.add(rbox(0.6, 0.45, 0.04, 0.02), c, { p: [x, y, -2.68] }); b.add(G.sph(0.05, 6, 4), C.red, { p: [x, y + 0.2, -2.64], outline: false }); });
    b.add(G.cyl(0.015, 0.015, 1.6, 4), C.red, { p: [-0.45, 2.8, -2.65], r: [0, 0, 1.1], outline: false }); b.add(G.cyl(0.015, 0.015, 1.1, 4), C.red, { p: [0.65, 2.85, -2.65], r: [0, 0, -1.3], outline: false });
    b.add(G.tor(0.35, 0.07, 8, 22), C.gold, { p: [3.3, 3.1, -2.7] }); b.add(rbox(0.12, 0.5, 0.08, 0.04), C.woodD, { p: [3.6, 2.7, -2.7], r: [0, 0, 0.8] });
    this.scene.add(mk(b));
    this.gaja = this.addChar(makeGaja()); this.gaja.root.position.set(3.4, 0, 0.6); this.gaja.root.rotation.y = -0.7;
    this.kid = this.addChar(makeKidAvatar()); this.kid.root.position.set(-3.4, 0, 1.0); this.kid.root.rotation.y = 0.6;
    this.setCam(V3(0, 3.6, 9.4), V3(0, 1.3, -0.4));
    this.queue = Learning.makePatrol(3);
    UI.hud(this.queue.length, '⭐');
    this.stands = [];
  }
  async start() {
    Music.set('case');
    await this.sleep(0.4);
    await this.say('patrol_intro', this.gaja);
    let done = 0;
    for (let i = 0; i < this.queue.length; i++) {
      const q = this.queue[i];
      const ok = q.kind === 'props' ? await this.askProps(q) : await this.askCards(q);
      Learning.record(q.concept, ok);
      if (ok) { UI.hudFill(done, '⭐'); done++; }
      else { Learning.requeue(this.queue, i, q); UI.hud(this.queue.length, '⭐'); for (let k = 0; k < done; k++) UI.hudFill(k, '⭐'); }
    }
    S.progress.patrol[this.next] = true; Save.save('progress');
    this.kid.cheer(1); this.confetti(V3(0, 2, 0), 60);
    await this.say('patrol_done', this.gaja);
    SM.go(CaseStage, { caseId: this.next });
  }
  async askProps(q) {
    const askSafe = Math.random() < 0.5;
    const opts = shuffle(q.options);
    this.stands = opts.map((o, i) => { const g = PATROL_STANDS[o.stand](); g.position.set(i ? 1.7 : -1.7, 0, 0); g.scale.setScalar(0.001); this.scene.add(g); Tween.run(0.5, k => g.scale.setScalar(Math.max(0.001, k)), { ease: Ease.outBack }); return { o, g, anchor: () => g.position.clone().add(V3(0, g.userData.anchorY || 1.2, 0)), radius: 0.9 }; });
    Sfx.play('pop');
    await this.say(askSafe ? 'pq_safe' : 'pq_hurt', this.gaja);
    const pickIt = await this.step(new Promise(res => { this._pick = res; }));
    this._pick = null;
    const correct = this.stands.find(s => askSafe ? !s.o.hazard : s.o.hazard);
    const ok = pickIt === correct;
    const m = Markers.add(correct.anchor, `<div class="ring ${correct.o.hazard ? 'hz' : 'sf'} pop"><i>${correct.o.hazard ? '!' : '✔'}</i></div>`);
    if (ok) { Sfx.play('chime'); this.sparkle(correct.anchor()); this.kid.cheer(1); await this.say('pq_yes', this.gaja); }
    else { Sfx.play('hmm'); wobble(correct.g, 0.8, 0.1); await this.say('pq_show', this.gaja); }
    Markers.remove(m);
    await Tween.run(0.3, k => this.stands.forEach(s => s.g.scale.setScalar(Math.max(0.001, 1 - k))));
    this.stands.forEach(s => this.scene.remove(s.g)); this.stands = [];
    return ok;
  }
  async askCards(q) {
    const cs = new CardSet(this, q.cards);
    cs.readAll(q.prompt);
    const i = await cs.pick(); cs.stopReading();
    const ok = !!q.cards[i].correct;
    const ci = q.cards.findIndex(c => c.correct);
    cs.mark(ci, 'picked');
    if (ok) { Sfx.play('chime'); this.kid.cheer(1); await this.say('pq_yes', this.gaja); }
    else { Sfx.play('hmm'); cs.els[i].classList.add('used'); await this.say('pq_show', this.gaja); }
    cs.remove(); await this.sleep(0.3);
    return ok;
  }
  onTap(x, y) {
    if (!this._pick || !this.stands.length) return;
    tapFx(x, y);
    const hit = pickNearest(this.stands, x, y, this.camera, 60);
    if (hit) { Sfx.play('pop'); const f = this._pick; this._pick = null; f(hit); }
  }
}

function boot() {
  // debug only: simulate a browser where storage throws (private mode / blocked)
  if (CONFIG.debug && /[?&]nostore\b/.test(location.search)) { const boom = () => { throw new Error('blocked'); }; Storage.prototype.getItem = boom; Storage.prototype.setItem = boom; Storage.prototype.removeItem = boom; }
  buildStrings();
  Save.load();
  initMaterials();
  UI.init();
  Voice.init();
  Engine.init();
  Input.init(Engine.canvas);
  window.__sdtBooted = true;
  // fetch every font weight now, so switching language later makes no network request
  try { if (document.fonts) ['500', '700', '800'].forEach(w => { document.fonts.load(`${w} 20px "Baloo 2"`, 'Aa'); document.fonts.load(`${w} 20px "Baloo Thambi 2"`, 'தமிழ்'); }); } catch (e) {}
  $('#boot').hidden = true;
  if (CONFIG.debug) window.SDT = { S, SM, CASES, Save, Progress, Learning, Voice, UI, Engine, Tween, HubStage, CaseStage, RewardStage, PickerStage, PatrolStage, Session };
  const q = new URLSearchParams(location.search);
  // debug only: keep simulating while the tab is hidden (automated testing)
  if (CONFIG.debug && q.has('tick')) { let last = performance.now(); setInterval(() => { const now = performance.now(); let el = Math.min(1.5, (now - last) / 1000); last = now; if (!document.hidden) return; while (el > 0.0001) { const d = Math.min(0.05, el); el -= d; Tween.update(d); if (SM.stage) SM.stage.update(d); } if (SM.stage) { Engine.renderer.render(SM.stage.scene, SM.stage.camera); Markers.update(SM.stage.camera); Hand.update(SM.stage.camera); } }, 33); }
  if (CONFIG.debug && q.get('case')) { if (!S.profile.avatar) S.profile.avatar = 'anil'; SM.go(CaseStage, { caseId: q.get('case') }); return; }
  SM.go(HubStage, { title: true });
}
/* Offline play: register the service worker (sw.js). Skipped on file://, where
   service workers are unavailable (e.g. sandboxed previews), and in ?debug
   sessions unless &sw is added, so test runs never serve stale files. */
function registerServiceWorker() {
  try {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    if (CONFIG.debug && !/[?&]sw\b/.test(location.search)) return;
    const go = () => navigator.serviceWorker.register('sw.js').catch(() => {});
    if (document.readyState === 'complete') go(); else addEventListener('load', go, { once: true });
  } catch (e) {}
}
try { boot(); registerServiceWorker(); } catch (e) { console.error(e); const m = document.getElementById('bootMsg'); if (m) m.textContent = 'Something went wrong. Please reload. / பிழை. மீண்டும் திறக்கவும்.'; }
</script>
